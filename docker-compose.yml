# Melichinkul - Docker (sin Sail)
# PostgreSQL: host Ubuntu (host.docker.internal). Crear BD: melichinkul_db
# Mailpit: http://localhost:8025 para ver correos de prueba

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melichinkul_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - /home/rodrigo/Descargas:/descargas
    networks:
      melichinkul_network:
        # IP fija: tras --force-recreate "app" cambiaba de IP y nginx seguía con la antigua → 502.
        ipv4_address: 10.246.0.10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LARAVEL_DEPLOY_UID=1000
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_DATABASE=melichinkul_db
      - DB_USERNAME=admin
      - DB_PASSWORD=${DB_PASSWORD:-}
      # Correo: solo desde .env del proyecto (volumen ./). No inyectar MAIL_* aquí: Docker sobreescribe
      # getenv sobre Dotenv y forzaba mailpit en servidor si faltaba una variable en el .env de despliegue.
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:-melichinkul}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-local-key}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-local-secret}
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http

  nginx:
    image: nginx:alpine
    container_name: melichinkul_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - melichinkul_network
    depends_on:
      - app

  redis:
    image: redis:alpine
    container_name: melichinkul_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - melichinkul_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: melichinkul_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - melichinkul_network

  # WebSockets (Laravel Reverb) para notificaciones en tiempo real
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melichinkul_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - melichinkul_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LARAVEL_DEPLOY_UID=1000
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:-melichinkul}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-local-key}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-local-secret}
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REDIS_HOST=redis
    ports:
      - "8002:8080"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  # Procesa la cola (notificaciones por email, jobs)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melichinkul_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - melichinkul_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LARAVEL_DEPLOY_UID=1000
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_DATABASE=melichinkul_db
      - DB_USERNAME=admin
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:-melichinkul}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-local-key}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-local-secret}
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600

networks:
  melichinkul_network:
    driver: bridge
    ipam:
      config:
        # Subred poco habitual para evitar solapamiento con otras redes Docker del host.
        - subnet: 10.246.0.0/24
          gateway: 10.246.0.1
